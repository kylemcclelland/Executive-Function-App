[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "executive-function-backend"
version = "0.1.0"
description = "Private, timezone-aware task and inbox API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "clerk-backend-api==7.1.0",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "PyJWT==2.15.1",
  "psycopg[binary]==3.3.8",
  "pywebpush==2.5.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
