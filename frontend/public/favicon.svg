<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Optima Pars">
  <!-- Simplified from the Optima Pars logo: Romanesque arch, abbey and bell tower with a cross,
       cypresses on green hills. No lettering, so it holds up at 16px. -->
  <path d="M6 61V29C6 14 17 3 32 3s26 11 26 26v32z" fill="#B39455"/>
  <path d="M9 58V29C9 16 19 6 32 6s23 10 23 23v29z" fill="#2C4A37"/>
  <!-- hills -->
  <path d="M9 47c9-4 16-3 23 0s15 3 23-1v12H9z" fill="#3F6149"/>
  <!-- cypresses -->
  <path d="M14.5 54c-4.5-4-4-14 0-24 4 10 4.5 20 0 24z" fill="#14281C"/>
  <path d="M49.5 54c-4.5-4-4-14 0-24 4 10 4.5 20 0 24z" fill="#14281C"/>
  <!-- abbey: long nave and bell tower -->
  <path d="M17 56V42h30v14z" fill="#F3E9D2"/>
  <path d="M17 42l3-3h24l3 3z" fill="#D9C79A"/>
  <path d="M26.5 56V24h11v32z" fill="#F7EEDA"/>
  <path d="M25 24l7-7 7 7z" fill="#D9C79A"/>
  <!-- belfry opening, doors -->
  <path d="M29.8 35v-6a2.2 2.2 0 0 1 4.4 0v6z" fill="#2C4A37"/>
  <path d="M29.5 56v-6a2.5 2.5 0 0 1 5 0v6z" fill="#2C4A37"/>
  <path d="M20 56v-5a1.8 1.8 0 0 1 3.6 0v5z M40.4 56v-5a1.8 1.8 0 0 1 3.6 0v5z" fill="#6B7F60"/>
  <!-- cross -->
  <path d="M30.9 7.5h2.2V17.5h-2.2z" fill="#E7CF8F"/>
  <path d="M28.2 10.4h7.6v2.1h-7.6z" fill="#E7CF8F"/>
</svg>
